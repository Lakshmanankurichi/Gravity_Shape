<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Sketch Pad Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #0d0e12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      transition: background-color 0.4s ease;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* --- PREMIUM FLOATING HEADER PANEL --- */
    #header-container {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    #header-container h1 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      margin-bottom: 4px;
    }
    #header-container .designer-signature {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
    }

    /* --- PREMIUM BOTTOM TOOLBAR --- */
    #toolbar-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(18, 20, 26, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .tool-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 4px;
    }

    /* --- MINIMAL APPARATUS BUTTONS --- */
    button {
      background: transparent;
      color: #9ca3af;
      border: 1px solid transparent;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    button:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }
    button.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }
    button.accent-toggle.active {
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.25);
    }
    button.danger:hover {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
    }

    /* --- REFINED COLOR CONTAINER --- */
    .color-picker-wrapper {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s;
      margin: 0 4px;
    }
    input[type="color"] {
      position: absolute;
      top: -5px;
      left: -5px;
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    /* --- FLOATING HUD STATUS --- */
    #global-hud {
      position: absolute;
      top: 24px;
      left: 24px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6b7280;
      font-weight: 600;
      z-index: 10;
    }

    /* --- BLACK HOLE LAYER --- */
    .premium-vortex {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      z-index: 2;
      box-shadow: 0 0 60px 20px rgba(99, 102, 241, 0.05);
      animation: spinVortex 12s linear infinite;
    }
    .premium-vortex::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px 3px #ffffff;
    }
    @keyframes spinVortex { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
  </style>
</head>
<body>

  <!-- System Top Display -->
  <div id="global-hud">Topology: Stable</div>

  <!-- Premium Floating Header -->
  <div id="header-container">
    <h1>Gravity Sketch Pad Pro</h1>
    <div class="designer-signature">Designed by lakshmanankurichi</div>
  </div>

  <!-- Core App Engine Viewport -->
  <div id="canvas-container"></div>
  <div id="vortex" class="premium-vortex"></div>

  <!-- Central Bottom Control Grid -->
  <div id="toolbar-container">
    
    <!-- Group 1: Material Brush & Colors -->
    <div class="tool-section">
      <div class="color-picker-wrapper" title="Ink Tone Geometry">
        <input type="color" id="brush-color" value="#ffffff">
      </div>
    </div>

    <div class="divider"></div>

    <!-- Group 2: Shape Archetypes Selection -->
    <div class="tool-section">
      <button class="shape-btn active" data-shape="freeform" title="Draw Rigid Line Structures">
        <svg viewBox="0 0 24 24"><path d="M12 20C17.5228 20 22 15.5228 22 10C22 4.47715 17.5228 2 12 2C6.47715 2 2 4.47715 2 10C2 13.4613 3.75416 16.5121 6.42188 18.3125L4 22L8.5 20.5C9.59354 20.9158 10.7712 21.1394 12 21.1394" stroke-dasharray="3 3"/></svg>
      </button>
      <button class="shape-btn" data-shape="circle" title="Instant Sphere Spawner">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
      </button>
      <button class="shape-btn" data-shape="box" title="Instant Square Block Spawner">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Group 3: Gravity Vectors Layout -->
    <div class="tool-section">
      <button class="gravity-btn active" data-g="down" title="Vector Down">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      </button>
      <button class="gravity-btn" data-g="up" title="Vector Up">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      <button class="gravity-btn" data-g="left" title="Vector Left">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button class="gravity-btn" data-g="right" title="Vector Right">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <button class="gravity-btn" data-g="none" title="Null Gravity Environment">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M4 12h16"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Group 4: Field Modifiers Configuration -->
    <div class="tool-section">
      <button id="btn-env-blackhole" class="accent-toggle" title="Vortex Core Field">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9M21 3.5a9 9 0 0 0-9 9"/></svg>
      </button>
      <button id="btn-env-wind" class="accent-toggle" title="Continuous Directional Wind Pressure">
        <svg viewBox="0 0 24 24"><path d="M2 8h16M2 12h20M2 16h11M18 6a2 2 0 1 1 2 2"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Group 5: Background Dynamic Color Matrix -->
    <div class="tool-section">
      <button class="bg-btn active" data-bg="#0d0e12" title="Obsidian Studio Space" style="background:#0d0e12; border: 1px solid rgba(255,255,255,0.2); width:24px; height:24px; border-radius:50%; margin: 0 2px;"></button>
      <button class="bg-btn" data-bg="#1a1c24" title="Minimal Charcoal Space" style="background:#1a1c24; width:24px; height:24px; border-radius:50%; margin: 0 2px;"></button>
      <button class="bg-btn" data-bg="#1f232b" title="Deep Nordic Blueprint" style="background:#1f232b; width:24px; height:24px; border-radius:50%; margin: 0 2px;"></button>
    </div>

    <div class="divider"></div>

    <!-- Group 6: System Actions -->
    <div class="tool-section">
      <button id="btn-clear-canvas" class="danger" title="Purge Current Environment Elements">
        <svg viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7M10 11v6M14 11v6M4 7h16M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
      </button>
    </div>

  </div>

  <!-- Core Mechanics Framework Injection -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
    const { Engine, Render, Runner, Bodies, Composite, Vector, Body, Events } = Matter;

    const engine = Engine.create({ gravity: { x: 0, y: 1, scale: 0.001 } });
    const world = engine.world;
    const container = document.getElementById('canvas-container');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    let currentCanvasBg = '#0d0e12';

    const render = Render.create({
      element: container,
      engine: engine,
      options: {
        width: width,
        height: height,
        wireframes: false,
        background: currentCanvasBg
      }
    });

    Render.run(render);
    Runner.run(Runner.create(), engine);

    // Dynamic Variables State Matrix
    let brushColor = '#ffffff';
    let activeShapeType = 'freeform'; // Archetypes: 'freeform', 'circle', 'box'
    let brushThickness = 6;
    let environment = { blackHole: false, wind: false };
    
    let isDrawing = false;
    let dragStartPoint = null;
    let lastPoint = null;
    let currentSegments = [];
    const MIN_DIST = 12;

    // View Edge Boundaries
    let boundaries = [];
    function setupBoundaries() {
      boundaries.forEach(b => Composite.remove(world, b));
      const thick = 100;
      const opts = { isStatic: true, render: { fillStyle: 'transparent' }, friction: 0.2, restitution: 0.5 };
      boundaries = [
        Bodies.rectangle(width / 2, height + thick/2, width * 2, thick, opts),
        Bodies.rectangle(width / 2, -thick/2, width * 2, thick, opts),
        Bodies.rectangle(-thick/2, height / 2, thick, height * 2, opts),
        Bodies.rectangle(width + thick/2, height / 2, thick, height * 2, opts)
      ];
      Composite.add(world, boundaries);
    }
    setupBoundaries();

    // Canvas Input System Event Route
    const canvasElement = render.canvas;
    
    canvasElement.addEventListener('mousedown', (e) => {
      if (e.target.closest('#toolbar-container')) return;
      isDrawing = true;
      dragStartPoint = { x: e.clientX, y: e.clientY };
      lastPoint = { x: e.clientX, y: e.clientY };
      currentSegments = [];
    });

    canvasElement.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      
      const currentPoint = { x: e.clientX, y: e.clientY };

      if (activeShapeType === 'freeform') {
        const distance = Vector.magnitude(Vector.sub(currentPoint, lastPoint));
        if (distance > MIN_DIST) {
          const midX = (lastPoint.x + currentPoint.x) / 2;
          const midY = (lastPoint.y + currentPoint.y) / 2;
          const angle = Math.atan2(currentPoint.y - lastPoint.y, currentPoint.x - lastPoint.x);

          const segment = Bodies.rectangle(midX, midY, distance + 1, brushThickness, {
            angle: angle,
            render: { fillStyle: brushColor }
          });

          currentSegments.push(segment);
          Body.setStatic(segment, true);
          Composite.add(world, segment);
          lastPoint = currentPoint;
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      
      const endPoint = { x: e.clientX, y: e.clientY };

      if (activeShapeType === 'freeform') {
        if (currentSegments.length > 0) {
          currentSegments.forEach(s => Composite.remove(world, s));
          const compoundBody = Body.create({
            parts: currentSegments,
            friction: 0.1,
            restitution: 0.4
          });
          Composite.add(world, compoundBody);
        }
      } else {
        // Handle Primitive Geometry Spawning Vectors
        const deltaX = endPoint.x - dragStartPoint.x;
        const deltaY = endPoint.y - dragStartPoint.y;
        const size = Math.max(Vector.magnitude(Vector.create(deltaX, deltaY)), 20); // Minimum size guard
        
        let spawnedShape;
        if (activeShapeType === 'circle') {
          spawnedShape = Bodies.circle(dragStartPoint.x, dragStartPoint.y, size / 2, {
            restitution: 0.5,
            render: { fillStyle: brushColor }
          });
        } else if (activeShapeType === 'box') {
          spawnedShape = Bodies.rectangle(dragStartPoint.x, dragStartPoint.y, size, size, {
            restitution: 0.4,
            render: { fillStyle: brushColor }
          });
        }
        Composite.add(world, spawnedShape);
      }
      updateHUD();
    });

    // Environmental Forces System Interceptor
    Events.on(engine, 'beforeUpdate', () => {
      const bodies = Composite.allBodies(world);
      bodies.forEach(body => {
        if (body.isStatic) return;

        if (environment.blackHole) {
          const delta = Vector.create((width / 2) - body.position.x, (height / 2) - body.position.y);
          const dist = Vector.magnitude(delta);
          if (dist > 10) {
            const pullForce = (body.mass * 1.6) / dist;
            Body.applyForce(body, body.position, Vector.mult(Vector.normalise(delta), pullForce));
          }
        }

        if (environment.wind) {
          const pulse = (Math.sin(Date.now() * 0.003) * 0.0002) + 0.0005;
          Body.applyForce(body, body.position, { x: pulse * body.mass, y: 0 });
        }
      });
    });

    // Controller Bindings
    document.getElementById('brush-color').addEventListener('input', (e) => brushColor = e.target.value);

    // Shape Matrix Switching
    document.querySelectorAll('.shape-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const target = e.target.closest('.shape-btn');
        document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
        target.classList.add('active');
        activeShapeType = target.getAttribute('data-shape');
      });
    });

    // Gravity Matrix Setup
    document.querySelectorAll('.gravity-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const targetButton = e.target.closest('.gravity-btn');
        document.querySelectorAll('.gravity-btn').forEach(b => b.classList.remove('active'));
        targetButton.classList.add('active');
        
        const mode = targetButton.getAttribute('data-g');
        engine.gravity.x = mode === 'left' ? -1 : mode === 'right' ? 1 : 0;
        engine.gravity.y = mode === 'up' ? -1 : mode === 'down' ? 1 : 0;
        updateHUD();
      });
    });

    // Environmental Forces Modifiers
    const bhBtn = document.getElementById('btn-env-blackhole');
    const vortex = document.getElementById('vortex');
    bhBtn.addEventListener('click', () => {
      environment.blackHole = !environment.blackHole;
      bhBtn.classList.toggle('active', environment.blackHole);
      vortex.style.display = environment.blackHole ? 'block' : 'none';
      updateHUD();
    });

    const windBtn = document.getElementById('btn-env-wind');
    windBtn.addEventListener('click', () => {
      environment.wind = !environment.wind;
      windBtn.classList.toggle('active', environment.wind);
      updateHUD();
    });

    // Background Studio Color Matrix Controller
    document.querySelectorAll('.bg-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.bg-btn').forEach(b => b.style.borderColor = 'transparent');
        const selectedBg = e.target.getAttribute('data-bg');
        e.target.style.borderColor = 'rgba(255,255,255,0.4)';
        
        currentCanvasBg = selectedBg;
        render.options.background = selectedBg;
        document.body.style.backgroundColor = selectedBg;
      });
    });

    document.getElementById('btn-clear-canvas').addEventListener('click', () => {
      Composite.allBodies(world).forEach(b => { if(!b.isStatic) Composite.remove(world, b); });
      updateHUD();
    });

    function updateHUD() {
      const total = Composite.allBodies(world).filter(b => !b.isStatic).length;
      document.getElementById('global-hud').innerText = `Active Objects: ${total}`;
    }

    window.addEventListener('resize', () => {
      width = window.innerWidth; height = window.innerHeight;
      render.canvas.width = width; render.canvas.height = height;
      setupBoundaries();
    });
  </script>
</body>
</html>
